server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://106.12.52.116:1999/freetrader?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: free
    password: free123
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.freetrader.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: NOW()
      logic-not-delete-value: "null"

# JWT Configuration
jwt:
  secret: freetrader-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
  expiration: 86400000  # 24 hours in milliseconds

# App Configuration
app:
  trading-days: 7      # Default number of trading days for average calculation
  top-funds: 10        # Default number of top funds to display in sector detail
