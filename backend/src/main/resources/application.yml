server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/freetrader?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes default TTL
      cache-null-values: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.freetrader.entity
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境建议关闭 SQL 日志
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: NOW()
      logic-not-delete-value: "null"

# JWT Configuration
jwt:
  # 重要：生产环境必须通过环境变量设置安全的密钥
  secret: ${JWT_SECRET:dev-only-secret-key-please-change-in-production-environment-min-32-bytes}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600000}    # 1 hour
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days

# App Configuration
app:
  trading-days: ${APP_TRADING_DAYS:7}      # Default number of trading days for average calculation
  top-funds: ${APP_TOP_FUNDS:10}           # Default number of top funds to display in sector detail
  
  # Sector calculation constants
  sector:
    estimated-cap-multiplier: ${SECTOR_CAP_MULTIPLIER:50}    # Multiplier for market cap estimation
    base-price: ${SECTOR_BASE_PRICE:1000.0}                  # Base price for sector
    # Trend chart configuration
    trend-base-value: ${SECTOR_TREND_BASE:10.0}              # Base value for trend lines
    trend-direction-factor: ${SECTOR_TREND_DIRECTION:0.3}    # Direction factor for up/down trends
    trend-data-points: ${SECTOR_TREND_POINTS:7}              # Number of data points in trend
    trend-volatility: ${SECTOR_TREND_VOLATILITY:2.0}         # Volatility range for trend

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.freetrader: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_PATH:logs}/freetrader.log
    max-size: 10MB
    max-history: 30

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha
